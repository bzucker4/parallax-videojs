name: Verify PARALLAX
on:
  push:
    branches: [main, feat/precision-skin]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
